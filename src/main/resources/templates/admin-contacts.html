<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Contact Inbox</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(120deg, #1e3c72, #2a5298);
            padding: 30px;
        }

        h2 {
            text-align: center;
            color: white;
            margin-bottom: 25px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .name {
            font-weight: 600;
            color: #2a5298;
            font-size: 16px;
        }

        .email {
            font-size: 13px;
            color: gray;
        }

        .msg {
            margin-top: 10px;
            padding: 10px;
            background: #f5f7fb;
            border-radius: 8px;
        }

        .date {
            margin-top: 8px;
            font-size: 12px;
            color: gray;
        }

        .btn {
            background: #e53935;
            color: white;
            padding: 6px 12px;
            text-decoration: none;
            border-radius: 6px;
            font-size: 12px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #c62828;
        }
    </style>
</head>

<body>

<h2>📩 Admin Contact Inbox</h2>

<div class="container">

    <div th:each="c : ${contacts}" class="card">

        <div class="top">
            <div>
                <div class="name" th:text="${c.name}"></div>
                <div class="email" th:text="${c.email}"></div>
            </div>

            <a th:href="@{'/admin/delete-contact/' + ${c.id}}" class="btn">
                🗑 Delete
            </a>
        </div>

        <div class="msg" th:text="${c.message}"></div>

        <div class="date" th:text="${c.date}"></div>

    </div>

</div>

</body>
</html>
