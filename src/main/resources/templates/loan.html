<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Loan Dashboard</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(120deg, #1e3c72, #2a5298);
            min-height: 100vh;
            padding: 30px;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h2, h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        /* Card */
        .card {
            background: #ffffff;
            color: #333;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        /* Form */
        form {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input {
            padding: 12px;
            width: 60%;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        input:focus {
            border-color: #2a5298;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #2a5298;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1e3c72;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #2a5298;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

        /* Status Badge */
        .status {
            padding: 6px 12px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
        }

        .approved {
            background: green;
        }

        .pending {
            background: orange;
        }

        .rejected {
            background: red;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">
        <h2>💰 Apply for Loan</h2>

        <form action="/loan/apply" method="post">
            <input type="number" name="amount" placeholder="Enter Loan Amount" required>
            <button type="submit">Apply</button>
        </form>
    </div>

    <div class="card">
        <h3>📊 Your Loans</h3>

        <table>
            <tr>
                <th>Amount</th>
                <th>Status</th>
            </tr>

            <tr th:each="l : ${loans}">
                <td>₹ <span th:text="${l.amount}"></span></td>

                <td>
                    <span class="status"
                          th:classappend="${l.status=='APPROVED'} ? 'approved' :
                                          (${l.status=='PENDING'} ? 'pending' : 'rejected')"
                          th:text="${l.status}">
                    </span>
                </td>
            </tr>

        </table>
    </div>

</div>

</body>
</html>
