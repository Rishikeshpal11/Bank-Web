<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* ✅ NEW BANKING BACKGROUND IMAGE */
            background: url('https://images.unsplash.com/photo-1563013544-824ae1b704d3?auto=format&fit=crop&w=1400&q=80')
                        no-repeat center center/cover;

            height: 100vh;
        }

        /* DARK OVERLAY */
        .overlay {
            background: rgba(0,0,0,0.65);
            height: 100vh;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(13, 71, 161, 0.85);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        /* MAIN */
        .container {
            text-align: center;
            margin-top: 70px;
            color: white;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #ddd;
            font-size: 18px;
        }

        /* BUTTONS */
        .btn {
            text-decoration: none;
            padding: 12px 25px;
            margin: 10px;
            border-radius: 8px;
            display: inline-block;
            font-weight: bold;
            transition: 0.3s;
        }

        .login {
            background: #00c853;
            color: white;
        }

        .register {
            background: #2962ff;
            color: white;
        }

        .btn:hover {
            transform: scale(1.05);
        }

        /* FEATURES */
        .features {
            display: flex;
            justify-content: center;
            margin-top: 60px;
            gap: 20px;
        }

        .box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            width: 220px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
        }

        .box h3 {
            margin-bottom: 8px;
        }

    </style>
</head>

<body>

<div class="overlay">

<!-- NAVBAR -->
<div class="navbar">
    <div class="logo">🏦 My Bank</div>
    <div>Secure Digital Banking</div>
</div>

<!-- MAIN -->
<div class="container">
    <h1>Welcome to Digital Banking</h1>
    <p>Safe • Secure • Fast Banking System</p>

    <a href="/login" class="btn login">Login</a>
    <a href="/register" class="btn register">Register</a>

    <!-- FEATURES -->
    <div class="features">

        <div class="box">
            <h3>💰 Deposit</h3>
            <p>Instant money deposit</p>
        </div>

        <div class="box">
            <h3>🏧 Withdraw</h3>
            <p>Fast cash withdrawal</p>
        </div>

        <div class="box">
            <h3>🔁 Transfer</h3>
            <p>Secure instant transfer</p>
        </div>

    </div>
</div>

</div>

</body>
</html>
