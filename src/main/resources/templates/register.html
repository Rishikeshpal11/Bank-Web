<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - Secure Bank</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
        }

        /* ---------------- NAVBAR ---------------- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 30px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00e5ff;
        }

        .nav-links a {
            color: white;
            margin: 0 12px;
            text-decoration: none;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #00e5ff;
        }

        /* ---------------- CENTER BOX ---------------- */
        .container {
            height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 400px;
            padding: 30px;
            border-radius: 18px;

            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.2);

            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #00e5ff;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;

            border: none;
            border-radius: 10px;
            outline: none;

            background: rgba(255,255,255,0.2);
            color: white;
        }

        input::placeholder {
            color: #ddd;
        }

        select {
            color: black;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(45deg, #00e5ff, #0077ff);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .success {
            text-align: center;
            color: lightgreen;
            margin-bottom: 10px;
        }

        .error {
            text-align: center;
            color: #ff4d6d;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">
    <div class="logo">🏦 MyBank</div>

    <div class="nav-links">
        <a href="/login">Login</a>
        <a href="/">Home</a>
    </div>
</div>

<!-- ================= REGISTER FORM ================= -->
<div class="container">

    <div class="box">

        <h2>🏦 Secure Banking Register</h2>

        <!-- SUCCESS -->
        <div th:if="${param.success}" class="success">
            🎉 Account Created Successfully!
        </div>

        <!-- ERROR -->
        <div th:if="${param.error}" class="error">
            ❌ Something went wrong!
        </div>

        <form action="/register" method="post">

            <input type="text" name="name" placeholder="Full Name" required>

            <input type="email" name="email" placeholder="Email Address" required>

            <input type="password" name="password" placeholder="Password" required>

            <select name="role" required>
                <option value="USER">👤 User Account</option>
                <option value="ADMIN">🛡 Admin Account</option>
            </select>

            <button type="submit">Create Account</button>

        </form>

    </div>

</div>

</body>
</html>
