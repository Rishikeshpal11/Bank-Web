<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .navbar {
            background: #0d47a1;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        .nav-links a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 30px;
        }

        h2 {
            color: #0d47a1;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: 0.3s;
            text-align: center;
        }

        .card:hover {
            transform: scale(1.05);
            cursor: pointer;
        }

        .card h3 {
            margin-bottom: 10px;
            color: #0d47a1;
        }

        .card p {
            color: #555;
        }

        a {
            text-decoration: none;
            color: inherit;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
    <div>🏦 Admin Panel</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<!-- MAIN -->
<div class="container">
    <h2>Welcome Admin</h2>

    <div class="cards">

        <!-- USERS -->
		<a href="/admin/users-page">
            <div class="card">
                <h3>👥 Users</h3>
                <p>Manage Users</p>
            </div>
        </a>

        <!-- TRANSACTIONS -->
		<a href="/admin/transactions-page">
            <div class="card">
                <h3>📄 Transactions</h3>
                <p>View Records</p>
            </div>
        </a>

        <!-- ACCOUNTS -->
        <a href="/admin/accounts">
            <div class="card">
                <h3>💳 Accounts</h3>
                <p>View Accounts</p>
            </div>
        </a>

        <!-- LOANS ✅ FIXED -->
        <a href="/admin/loans">
            <div class="card">
                <h3>💰 Loans</h3>
                <p>Manage Loans</p>
            </div>
        </a>
		<a href="/admin/contacts">
		<div class="card">
		            <h3>📩 Contacts</h3>
		            <p>Manage Contacts</p>
		        </div>
		    </a>

    </div>
</div>

</body>
</html>
