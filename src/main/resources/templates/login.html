<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Bank Login</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            height: 100vh;
            color: white;
        }

        /* ================= NAVBAR ================= */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #00e5ff;
        }

        .nav-links a {
            color: white;
            margin: 0 12px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #00e5ff;
        }

        /* ================= LOGIN BOX ================= */
        .container {
            height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 380px;
            padding: 30px;
            border-radius: 18px;

            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);

            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        .login-box h2 {
            color: #00e5ff;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;

            border: none;
            border-radius: 10px;
            outline: none;

            background: rgba(255,255,255,0.2);
            color: white;
        }

        input::placeholder {
            color: #ddd;
        }

        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(45deg, #00e5ff, #0077ff);
            color: white;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .error {
            color: #ff4d6d;
            margin-top: 10px;
        }

        .footer {
            margin-top: 10px;
            font-size: 12px;
            color: #ccc;
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->
<div class="navbar">
    <div class="logo">🏦 MyBank</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/register">Register</a>
    </div>
</div>

<!-- ================= LOGIN ================= -->
<div class="container">

    <div class="login-box">

        <h2>🔐 Secure Login</h2>

        <form th:action="@{/login}" method="post">

            <input type="text" name="email" placeholder="Enter Email" required>

            <input type="password" name="password" placeholder="Enter Password" required>

            <select name="role">
                <option value="USER">User</option>
                <option value="ADMIN">Admin</option>
            </select>

            <button type="submit">Login</button>

        </form>

		<!-- 🔥 ERROR SHOW -->
		<p style="color:red;" th:if="${param.error}">
		    ❌ Invalid Email or Password
		</p>

        <div class="footer">
            Secure Banking System © 2026
        </div>

    </div>

</div>

</body>
</html>
